<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CROP LAND - Farmer Registration</title>

    <link rel="stylesheet" href="css/style1.css">

</head>

<body>

    <header>

        <div class="logo">
            🌾 CROP LAND
        </div>

        <nav>
            <a href="farmaland.html">Home</a>
            <a href="registration.html">Back</a>
        </nav>

    </header>


    <main class="registration">

        <h1>Farmer Registration</h1>

        <p>Create your CropLand farmer account</p>


        <form class="registration-form">

            <label>Full Name</label>

            <input type="text"
                   placeholder="Enter your full name"
                   required>


            <label>Mobile Number</label>

            <input type="tel"
                   placeholder="Enter mobile number"
                   required>


            <label>Email</label>

            <input type="email"
                   placeholder="Enter email address">


            <label>Farm Location</label>

            <input type="text"
                   placeholder="Village, District, State"
                   required>


            <label>Farm Size</label>

            <input type="text"
                   placeholder="Example: 5 acres">


            <label>Password</label>

            <input type="password"
                   placeholder="Create a password"
                   required>


            <button type="button" onclick="window.location.href='farmer-dashboard.html'">
    Create Farmer Account
</button>

        </form>

    </main>

</body>

</html>
